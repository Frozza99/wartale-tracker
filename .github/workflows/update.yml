name: Atualizar ranking Wartale

on:
  schedule:
    # Roda a cada 30 minutos (horário UTC — o GitHub não aceita fuso horário no cron)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Rodar o coletor de dados
        env:
          WARTALE_API_BASE_URL: ${{ secrets.WARTALE_API_BASE_URL }}
          WARTALE_API_KEY: ${{ secrets.WARTALE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run collect

      - name: Salvar alterações no repositório
        run: |
          git config user.name "wartale-tracker-bot"
          git config user.email "actions@github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Atualização automática do ranking"
          git push
